name: Checks

# WHY THIS EXISTS. This repository had no CI at all: 61 Python files, sixteen gates, every
# one run by hand. That is how OpenUSD went undeclared long enough for two gates to be
# unrunnable on every desk while still reading as coverage in the file list.
#
# CONTROLS ONLY, AND DELIBERATELY. Every job below runs `--self-test`, which is the question
# CI can answer: can this gate still reject the input it exists to reject. The gates that
# measure the corpus need the corpus, and the corpus is not in the repository -- running
# them here would report green for a check that never ran, which is rule 3's silent skip.
# `check_published.py` is the same case for a different reason: it needs a hub token.
#
# One job per environment rather than one job running everything, because the environments
# are `no-default-feature` and mutually exclusive on purpose: the renderer is pinned to one
# Mitsuba and must not move because a parquet library did.

on:
  pull_request:
  push:
    branches: [main/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  usd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: usd
      # The gate for rule 6, and the archive gate. Both were unrunnable until usd-core was
      # declared; the fixture is committed so the negative controls have a rig to break.
      - run: pixi run -e usd python check_conventions.py fixtures-conventions.usda --self-test
      - run: pixi run -e usd python check_anime_materials.py --self-test
      - run: pixi run -e usd python check_anime_materials.py anime_materials.usda
      - run: pixi run -e usd python usda_to_obj.py --self-test
      - run: pixi run -e usd python make_conventions_fixture.py --self-test

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: corpus
      - run: pixi run -e corpus python anny_render_schema.py

  anny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: anny
      - run: pixi run -e anny python check_readme_claims.py --self-test
      - run: pixi run -e anny python check_facial_actions.py --self-test
      - run: pixi run -e anny python check_published.py --self-test
      - run: pixi run -e anny python check_view_selection.py
      - run: pixi run -e anny python check_corpus_model.py --self-test
      - run: pixi run -e anny python interface_audit.py
      # Self-contained and already passing, and CI was not running any of them. Each proves
      # its own checks can fail: 4 controls, 3 corruptions, 6 corruptions respectively.
      - run: pixi run -e anny python test_topology_fk.py
      - run: pixi run -e anny python test_coco_fetch_list.py
      - run: pixi run -e anny python test_edit_provenance.py
      # THE CORPUS GATE, ON A GENERATED STUB. This is the exception to "controls only"
      # above and earns it: the stub is sampled deterministically from a seed, so it is
      # real corpus data rather than a corpus this runner happens to hold. The red/green
      # pass is the one that matters -- it mutates the stub and requires each check to
      # catch its own defect.
      - run: pixi run -e anny preflight
      - run: pixi run -e anny preflight-red-green

  # THE TAGGED NUMBERS IN CLAIMS.md.
  #
  # Gating on the exit code, which it could not do until now. This job was
  # `continue-on-error` across two environments, because the schema pair needed `corpus` and
  # the rig measurements needed `anny` and nothing had both. Declaring pandas and pyarrow in
  # `anny` for the corpus gate settled that as a side effect: one run derives all eleven, so
  # the job can fail properly instead of being something a reader learns to scroll past.
  readme-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: anny
      # `--pose-libraries` is NOT run here. It exits non-zero when no dataset root is
      # reachable, which is correct on a desk that should hold them and meaningless on a
      # runner that never will. Gating on it would fail this job for a fact about the
      # machine rather than about the repository.
      - run: pixi run -e anny python check_readme_claims.py
