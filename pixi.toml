# The render environment, declared, because the alternative is the Hailo session again.
#
# CLAUDE.md blocklists `uv` for project environments and records why: standing up the Hailo
# compiler took more than twenty packages, discovered one `ModuleNotFoundError` at a time,
# and afterwards none of it existed in a manifest, a lock or the logbook. The work was
# repeatable only by repeating the guessing.
#
# This file exists because that happened again on 2026-08-22, in a different shape. The
# renderer here was being driven from a system Python where `mitsuba`, `numpy` and `pillow`
# were installed by nobody in particular, and the Blender pass it replaces was being run
# from whatever version the desk's package manager last offered. Neither was written down.
#
# WHY MITSUBA AND NOT BLENDER. Blender is blocklisted for reproducibility: its headless
# output moves with the version and the build flags, and the version is pinned by nothing.
# Mitsuba is a wheel, so `pixi.lock` pins it exactly, and it renders the same bytes twice
# when the thread count is fixed -- measured, not assumed:
#
#   llvm_ad_rgb, 1 thread    identical, sha256 equal over two runs
#   llvm_ad_rgb, default     up to 1/255 on 12-16 pixels of 1,048,576
#   cuda_ad_rgb, default     the same, film accumulation order rather than metadata
#
# So `render_view.py` sets the thread count through the drjit API. The environment variable
# `DRJIT_NUM_THREADS` was tried first and had no effect at all.

# `workspace`, not `project`: pixi 0.76 deprecates the older spelling and warns on every
# invocation, and a warning nobody can act on trains people to ignore warnings.
[workspace]
name = "anny-render-corpus"
version = "0.1.0"
description = "ANNY render corpus: poses in, labelled frames out"
channels = ["conda-forge"]
# `osx-arm64` is here so the RENDER environment can be instantiated on the Mac, and it is
# deliberately NOT inherited by the CUDA features below. The renderer's shipping variant is
# `llvm_ad_rgb` at one thread -- a CPU path -- so the deterministic corpus render is portable
# and the generator environments are not: their torch comes from `download.pytorch.org/whl/cu128`
# and `whl/cu124`, which serve no Apple silicon wheels. Each of those features restates the
# platform list, so the manifest says which desk can hold which work and `pixi install` fails
# loudly rather than a person finding out after a model download.
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
numpy = ">=2.0"
pillow = ">=10.0"
pyyaml = ">=6.0"

[pypi-dependencies]
# Pinned exactly. The renderer is a measuring instrument, and an instrument that changes
# version between two runs has made the two runs incomparable.
mitsuba = "==3.9.1"
pygltflib = ">=1.16.5, <2"
pycocotools = ">=2.0.11, <3"

# DR.JIT FINDS ITS OWN LLVM ON WINDOWS AND LINUX AND NOT ON MACOS, so the path is declared
# rather than left to a person to export. `llvm_ad_rgb` is the SHIPPING variant -- the one the
# determinism measurement above pinned -- and without this it does not load at all:
#
#   ImportError: jit_init_thread_state(): the LLVM backend is inactive because the LLVM shared
#   library ("libLLVM.dylib") could not be found!
#
# There is no libLLVM.dylib on a stock macOS: Xcode ships none at a linkable path and Homebrew
# was absent here. So `libllvm20` is a declared osx-arm64 dependency and this points at it,
# which is the same rule the `uv` blocklist entry states -- an environment nothing declares is
# an environment nobody can rebuild.
[target.osx-arm64.activation.env]
DRJIT_LIBLLVM_PATH = "$CONDA_PREFIX/lib/libLLVM.20.1.dylib"

# Linux desks without a system libLLVM.so otherwise fail `set_variant("llvm_ad_rgb")` the same way.
[target.linux-64.activation.env]
DRJIT_LIBLLVM_PATH = "$CONDA_PREFIX/lib/libLLVM.so.20.1"

[tasks]
# The check the Blender blocklist entry demands of any replacement, as a task rather than a
# paragraph somebody has to remember to run.
render-view = "python render_view.py"
vrm-fetch = "python vrm_fetch.py"
vrm-check-aux = "python vrm_render.py --check-aux"
vrm-render = { cmd = "python vrm_render.py --count 300 --aux", depends-on = ["vrm-fetch", "vrm-check-aux"] }
vrm-pilot = { cmd = "python vrm_render.py --verify && python vrm_render.py --sheet", depends-on = ["vrm-render"] }

# THE RESTYLE ENVIRONMENT, SEPARATE FROM THE RENDER ONE ON PURPOSE.
#
# RFD 107a rule 2 restyles a render four ways, and two of those come from Qwen-Image-Edit: a
# 20B editor that needs torch, diffusers and a 4-bit quantiser. None of that belongs in the
# render environment, which is a measuring instrument pinned to one Mitsuba and should not
# move because a diffusion library did.
#
# It is a feature rather than a second undeclared venv, which is the whole point of the rule
# CLAUDE.md states: the Hailo session installed twenty packages one ModuleNotFoundError at a
# time and left nothing behind that described them.
#
# WHY THIS RUN EXISTS AT ALL. The pixal3d README records bnb 4-bit Qwen-Image producing
# camera-correct but noise-corrupted images across every software combination tried, with
# torch 2.4.1 the one constant, and says to retest on torch >= 2.6 before relying on it. This
# environment is that retest, so the torch version is the experiment rather than an incidental
# choice.
# NO CONDA PILLOW IN THIS ENVIRONMENT, AND THE REASON IS A DLL, NOT A PREFERENCE.
#
# The render environment takes numpy and pillow from conda-forge. Inheriting those here breaks
# on import: torchvision ships its own DLLs and shadows the libs conda's `_imaging.pyd` links
# against, so `import torchvision` is followed by
#
#   ImportError: DLL load failed while importing _imaging: The operating system cannot run %1.
#
# while `import torch; from PIL import Image` is fine. Measured both ways rather than guessed.
# So this environment declares no default feature and takes its numpy and pillow from PyPI,
# where the wheels carry their own DLLs and cannot disagree with torchvision's.
[feature.restyle]
# CUDA wheels only, so this feature is not offered on the Mac. Restating the platform
# list here is what makes the exclusion a solver error rather than a paragraph.
platforms = ["win-64", "linux-64"]

[feature.restyle.dependencies]
python = "3.11.*"

[feature.restyle.pypi-dependencies]
numpy = ">=2.0"
pillow = ">=10.0"
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cu128" }
# torchvision is not optional despite nothing here doing vision transforms: Qwen2VLProcessor
# builds a Qwen2VLVideoProcessor at load, which hard-requires it. Discovered by the pipeline
# failing at from_pretrained, which is the cheap place to find it.
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
# Unpinned deliberately: the lockfile is where the version lives, and a pin here would repeat
# a derivation the solver already does. The bound is the one the retest is about.
diffusers = "*"
transformers = "*"
accelerate = "*"
bitsandbytes = "*"

[environments]
restyle = { features = ["restyle"], no-default-feature = true }
omnigen2 = { features = ["omnigen2"], no-default-feature = true }
editscore = { features = ["editscore"], no-default-feature = true }
corpus = { features = ["corpus"], no-default-feature = true }
anny = { features = ["anny"], no-default-feature = true }
anny-mac = { features = ["anny-mac"], no-default-feature = true }
asr = { features = ["asr"], no-default-feature = true }
tts = { features = ["tts"], no-default-feature = true }
usd = { features = ["usd"], no-default-feature = true }

[target.osx-arm64.dependencies]
libllvm20 = ">=20.1.8,<21"

[target.linux-64.dependencies]
libllvm20 = ">=20.1.8,<21"

# OMNIGEN2, AND IT GETS ITS OWN ENVIRONMENT BECAUSE UPSTREAM PINS AGAINST THE OTHER ONE.
#
# Rule 2 needs an image editor that could plausibly run on the 8 GB Hailo-10H rather than only
# on a 24 GB desktop card. Qwen-Image-Edit is 20.4B, about 10.5 GB even at NF4, so it cannot
# fit; OmniGen2 is 7.8B across a 4B transformer and a 3.7B Qwen2.5-VL, roughly 4.3 GB at NF4.
# Apache-2.0 in the weights and in the code repo both, checked separately, because a permissive
# tag on one half says nothing about the other.
#
# The pins are UPSTREAM'S OWN, from their requirements.txt at 18e6f9d: torch 2.6.0 and
# transformers 4.51.3. The restyle feature runs torch 2.11 and transformers 5.15, which those
# contradict, so this is a second environment rather than a widened first one. That is the
# lesson from the Qwen packaging session written down: nineteen fixes went into reconstructing
# an environment the authors already published, and the cheaper move is to use theirs.
#
# no-default-feature for the same DLL reason as the restyle environment.
[feature.omnigen2]
# CUDA wheels only, so this feature is not offered on the Mac. Restating the platform
# list here is what makes the exclusion a solver error rather than a paragraph.
platforms = ["win-64", "linux-64"]

[feature.omnigen2.dependencies]
python = "3.11.*"

[feature.omnigen2.pypi-dependencies]
# The reference photographs live in zstd parquet with the bytes in-row, so the generator
# needs pyarrow to read one. Declared rather than discovered as a ModuleNotFoundError after
# the model has already loaded 17 GiB of weights.
pyarrow = ">=15"
torch = { version = "==2.6.0", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "==0.21.0", index = "https://download.pytorch.org/whl/cu124" }
transformers = "==4.51.3"
diffusers = "*"
accelerate = "*"
# Not in upstream's requirements: they run bf16 on cards that hold it. NF4 is what the 8 GB
# device question needs, so the quantiser is ours to add.
bitsandbytes = "*"
timm = "*"
einops = "*"
opencv-python-headless = "*"
scipy = "*"
omegaconf = "*"
python-dotenv = "*"
numpy = ">=2.0"
pillow = ">=10.0"
sentencepiece = "*"
protobuf = "*"

# EDITSCORE, WHICH IS A VERIFIER RATHER THAN A GENERATOR, AND THAT DISTINCTION IS THE POINT.
#
# Rule 4 says each restyled frame is checked against its render and a failure is discarded. The
# silhouette check in verify_restyle.py answers "did the body move" and nothing else; it cannot
# say whether the edit followed its instruction. EditScore is a reward model trained for exactly
# that judgement.
#
# Quantisation is permitted here where it is not for a generator. CLAUDE.md's condition 5 binds
# generators, because a quantised generator writes labels that are lies. A verifier emits a
# number about somebody else's frame, so nothing it produces enters a corpus -- but a quantised
# verifier can still be WRONG, and a verifier that passes bad frames is worse than none, so the
# 4-bit and bf16 scores get compared rather than assumed equal.
#
# It is a LoRA on Qwen/Qwen3-VL-4B-Instruct (Apache-2.0, ungated), 8.9 GB bf16 and about 2.5 GB
# at NF4, which is what makes it a candidate for the UGen300's 8 GB at all.
# TRAINING, NOT INFERENCE, AND THESE FOUR WERE THE WHOLE GAP. `train.py` imports `peft` for
# `LoraConfig` at line 265 and `matplotlib` at the top, and a run configured to log to
# tensorboard needs it present or accelerate raises at step 0 rather than at the end. wandb is
# deliberately absent: this desk has no run to log to, and the config asks for tensorboard only.
peft = "*"
matplotlib = "*"
tensorboard = "*"
# The transport module imports it at `omnigen2/transport/integrators.py:2`, so the trainer
# cannot even parse its config without it. Inference never touches that path, which is why an
# inference-only environment got this far without noticing.
torchdiffeq = "*"
# `omnigen2_train_dataset.py` reads every JSONL through `datasets.load_dataset("json", ...)`
# and concatenates the shards, which is also why all shards in one mix must share an Arrow
# schema: a t2i row lacking `input_images` beside an edit row that has it will not unify.
datasets = "*"
[feature.editscore]
# CUDA wheels only, so this feature is not offered on the Mac. Restating the platform
# list here is what makes the exclusion a solver error rather than a paragraph.
platforms = ["win-64", "linux-64"]

[feature.editscore.dependencies]
python = "3.11.*"

[feature.editscore.pypi-dependencies]
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
editscore = "*"
transformers = "*"
accelerate = "*"
peft = "*"
bitsandbytes = "*"
qwen-vl-utils = "*"
json-repair = "*"
pillow = ">=10.0"
numpy = ">=2.0"


# THE CORPUS ENVIRONMENT, AND IT EXISTS BECAUSE THE SCHEMA WAS NOT RUNNABLE.
#
# `anny_render_schema.py` imports pyarrow and `test_preflight.py` imports pandas, and until
# now neither appeared in this file or in the lock. So the ETNF schema -- the relation
# definitions, the foreign-key graph, `validate()`, and the `__main__` block that prints the
# relation count -- could not be executed from any declared environment, on any desk. That is
# the `uv` hazard with no `uv` involved: a dependency real work rests on, described nowhere.
#
# It is a feature with `no-default-feature` rather than three lines added to the render
# environment, for the reason the restyle feature already states: the renderer is a measuring
# instrument pinned to one Mitsuba, and it must not move because a parquet library did.
[feature.corpus.dependencies]
python = "3.11.*"
pyarrow = ">=15"
# Corpus rows carry image bytes, so anything that opens one needs pillow.
pillow = ">=10"
pandas = ">=2.0"
numpy = ">=2.0"

[feature.corpus.tasks]
# The schema's own summary: relation and foreign-key counts, read out of the definitions
# rather than restated. README numbers are checked against this.
schema = "python anny_render_schema.py"
# Whole-corpus gate. Takes a corpus root.
validate = "python anny_render_schema.py"
# The negative controls for the generated-synthetic checks. Needs no fixture: it builds and
# corrupts its own, because a test that skips when its fixture is absent reads like a pass.
test-edit-provenance = "python test_edit_provenance.py"
# The train2017 fetch list, and the gate that refuses to build a contaminated one.
coco-fetch-list = "python build_coco_fetch_list.py"
test-coco-fetch-list = "python test_coco_fetch_list.py"
# The shared-builder gate. Textual on purpose, so it runs without anny, torch or a GPU.
corpus-model = "python check_corpus_model.py"
test-corpus-model = "python check_corpus_model.py --self-test"
# Fetches the 8,220 licence-clean train2017 images. Re-asserts the holdout
# exclusion before the first network call and stores a sha256 per payload.
coco-download = "python download_coco_images.py"

# THE ANNY ENVIRONMENT, AND WHY IT IS SEPARATE FROM THE CORPUS ONE.
#
# `anny` needs torch, and the corpus feature is a parquet toolchain that must not acquire a
# CUDA stack because a body model was added beside it. Same argument the restyle feature
# already makes for the renderer.
#
# It exists because nothing in this checkout could import `anny` at all. That is why nine of
# the eleven tagged claims in CLAIMS.md report ModuleNotFoundError rather than a number, and
# why `interface_audit.py`'s expression check cannot run: it reads
# `model.facial_action_labels` and reports UNCHECKED when it cannot.
# THE USD ENVIRONMENT, AND IT EXISTS BECAUSE TWO GATES COULD NOT RUN.
#
# `check_anime_materials.py` and `check_conventions.py` both `from pxr import ...`, and no
# environment here declared OpenUSD, so neither could execute on any desk. A gate nobody
# can run is decoration: it certifies nothing while reading as coverage in the file list.
# `usda_to_obj.py` is the same import, and `testshape.obj` -- which `.gitignore` describes
# as generated by it -- was therefore not regenerable either.
#
# Pinned to the version `request-for-discussion` already pins, because `anime_materials.usda`
# is read by both repositories and a schema difference between them is a difference in what
# the archive means.
# From PyPI rather than conda-forge, which is also where `request-for-discussion` takes it:
# conda-forge has no `usd-core` candidate for osx-arm64 at this version, and dropping the
# platform would leave the mac desk unable to run the gates rather than fixing anything.
[feature.usd.dependencies]
python = "3.11.*"
numpy = ">=2.0"

[feature.usd.pypi-dependencies]
usd-core = "==26.8"

[feature.anny]
# Same exclusion, different reason: this feature takes torch from `whl/cpu`, which serves
# linux and windows wheels only. macOS arm64 torch lives on the default PyPI index, so
# offering `anny` here would need a second, mac-scoped feature rather than a wider list.
platforms = ["win-64", "linux-64"]

[feature.anny.dependencies]
python = "3.11.*"

# NUMPY FROM PYPI, NOT CONDA, AND THE REASON IS A RUNTIME CLASH RATHER THAN A PREFERENCE.
# With conda-forge numpy beside PyPI torch, importing both aborts:
#
#   OMP: Error #15: Initializing libomp.dll, but found libiomp5md.dll already initialized.
#
# Two OpenMP runtimes in one process. The documented workaround, KMP_DUPLICATE_LIB_OK=TRUE,
# says in its own text that it "may cause crashes or silently produce incorrect results",
# and this environment exists to take measurements -- a flag that can silently corrupt one
# is worse than no environment at all.
#
# Same shape as the restyle feature's note above about conda pillow against torchvision's
# DLLs, so the same answer: take both from PyPI, where the wheels carry their own runtimes
# and cannot disagree.
[feature.anny.pypi-dependencies]
anny = "*"
numpy = ">=2.0"
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cpu" }
# DECLARED, BECAUSE THE ALTERNATIVE WAS AN UNDECLARED INSTALL. The azimuth gate detects
# keypoints and then fits ANNY to them, and until now `rfdetr` lived only in
# `rf-detr-cpp/.pixi/envs/gate` while `anny` lived only here, so the two halves of one
# measurement could not run in one process. Adding it to a feature is a line in a diff;
# pip-installing it into an env nothing declares is the failure the `uv` blocklist entry
# describes. Torch above is the CPU index and rfdetr follows it rather than pulling its own.
rfdetr = "*"

# PANDAS AND PYARROW, BECAUSE THE CORPUS GATE NEEDED BOTH HALVES AND HAD NEITHER PLACE.
# `preflight_audit.py` reads the corpus with pandas and decodes it with `anny_rig`, and
# `sample_identities.py` writes parquet from a torch sample. torch lived here and parquet
# lived in `corpus`, so both files could run in no environment at all -- the 29-check gate
# that is supposed to run before a render had never executed anywhere.
#
# From PyPI, following the numpy note above: conda-forge pandas beside PyPI torch is the
# same two-OpenMP-runtimes abort that comment describes.
pandas = ">=2.0"
pyarrow = ">=15"

[feature.anny.tasks]
# Reads ANNY's own facial action labels and compares them against the 52-blendshape standard by NAME, in
# both directions -- which is the check `interface_audit.py` states as a count.
facs = "python check_facial_actions.py"

# A STUB CORPUS, BECAUSE THE GATE HAD NOTHING TO GATE. `preflight_audit.py` and
# `test_preflight.py` both take a corpus, and no corpus is in the repository, so neither had
# a way to run. Generated rather than committed: `sample_identities.py` is deterministic
# given its seed, so the stub is reproducible without a parquet blob in the tree, and
# generating it exercises the sampler as well.
#
# 3000 identities, not fewer. Below about that the detection-floor check fails on its own
# terms -- a 200-identity stub reports 28 checks rather than 29, because a subgroup check
# never fires, and that reads as a missing check rather than as a small corpus.
stub-corpus = "python sample_identities.py --out build/stub-corpus --count 3000"
preflight = { cmd = "python preflight_audit.py build/stub-corpus", depends-on = ["stub-corpus"] }
preflight-red-green = { cmd = "python test_preflight.py build/stub-corpus", depends-on = ["stub-corpus"] }

# The mac-scoped counterpart the [feature.anny] comment above names. Same package set;
# torch comes from the default PyPI index because whl/cpu (used by feature.anny for
# linux and windows) serves no macOS wheels. Kept as a separate feature rather than a
# wider platforms list because the torch source diverges per platform.
[feature.anny-mac]
platforms = ["osx-arm64"]

# The workspace-level [target.osx-arm64.activation.env] does not reach a `no-default-feature`
# environment. Restated here so `anny-mac` can find libLLVM.dylib at set_variant() time.
[feature.anny-mac.target.osx-arm64.activation.env]
DRJIT_LIBLLVM_PATH = "$CONDA_PREFIX/lib/libLLVM.20.1.dylib"

[feature.anny-mac.dependencies]
python = "3.11.*"
# Mitsuba's llvm_ad_rgb variant loads libLLVM.dylib at set_variant() time. Absent it, the
# import path prints an unhelpful "jit_init_thread_state" error and fails; the default env
# takes libllvm20 from conda-forge for the same reason.
libllvm20 = ">=20.1.8,<21"

[feature.anny-mac.pypi-dependencies]
anny = "*"
numpy = ">=2.0"
torch = ">=2.6"
rfdetr = "*"
pandas = ">=2.0"
pyarrow = ">=15"
# Mitsuba pinned to match the workspace default. MaskScore Rung 1 fits ANNY and renders it
# in one process; splitting the two into separate envs would need a mesh handoff on disk
# between calls, which is the seam a rung-1 run does not need.
mitsuba = "==3.9.1"

[feature.anny-mac.tasks]
facs = "python check_facial_actions.py"
stub-corpus = "python sample_identities.py --out build/stub-corpus --count 3000"
preflight = { cmd = "python preflight_audit.py build/stub-corpus", depends-on = ["stub-corpus"] }
preflight-red-green = { cmd = "python test_preflight.py build/stub-corpus", depends-on = ["stub-corpus"] }

# NVIDIA Parakeet TDT 0.6B v3 for ASR. Native word timestamps, 6.32% WER vs Whisper
# large-v3's 7.44%. Isolated env because NeMo drags in a large ML stack (hydra, omegaconf,
# lightning, sentencepiece, ...) that would risk clobbering anny-mac's torch pin.
[feature.asr]
platforms = ["osx-arm64"]

[feature.asr.dependencies]
python = "3.11.*"

[feature.asr.pypi-dependencies]
nemo_toolkit = { version = ">=2.0", extras = ["asr"] }
numpy = ">=2.0"
torch = ">=2.6"
soundfile = "*"
pyarrow = ">=15"
# Whisper large-v3 (Apache-2.0) auto-detect language.
openai-whisper = "*"
# transformers (Apache-2.0) hosts the additional judges we panel: wav2vec2, Voxtral,
# and Kyutai STT. All under permissive licences (Apache/CC-BY-4.0).
transformers = ">=4.50"
accelerate = "*"
librosa = "*"
# allosaurus (MIT): universal phone recognizer for the IPA panel's 5th judge.
allosaurus = "*"
mistral-common = ">=1.5.0"

# Qwen3-TTS-12Hz-1.7B-Base (Apache-2.0) for the Speech stub's 10-rank voice-clone
# candidates. Zero-shot 3-sec voice clone. Isolated in its own env because qwen-tts
# requires Python 3.12; asr's 3.11 stack (parakeet/whisper) would conflict.
[feature.tts]
platforms = ["osx-arm64"]

[feature.tts.dependencies]
python = "3.12.*"

[feature.tts.pypi-dependencies]
qwen-tts = "*"
soundfile = "*"
# torch+torchaudio pinned as a pair; qwen-tts's unpinned torchaudio pulled the latest
# wheel built against torch 2.5, then pip installed torch 2.9 latest and the ABI
# mismatched at import (torchaudio's C ext refuses to load). Pinning both to matching
# versions avoids the trap.
torch = "==2.5.1"
torchaudio = "==2.5.1"
# Voxtral (Apache-2.0) via Mistral's common package. Extras causes silent skip in
# this env; declare without extras and pixi installs the base package plus enough
# to satisfy transformers' MistralCommonTokenizer import.
mistral-common = ">=1.5"
# Kyutai STT (CC-BY-4.0) via its own moshi package.
moshi = "*"
